name: Build release assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            asset_name: mc-modpack-auto-updater-linux-x64.zip
          - runtime: win-x64
            asset_name: mc-modpack-auto-updater-win-x64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./MCModpackAutoUpdater.slnx

      - name: Publish
        run: >
          dotnet publish ./MCModpackAutoUpdater/MCModpackAutoUpdater.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./artifacts/${{ matrix.runtime }}/publish
          /p:ContinuousIntegrationBuild=true

      - name: Package
        run: |
          cd ./artifacts/${{ matrix.runtime }}/publish
          zip -r ../${{ matrix.asset_name }} .

      - name: Publish remote agent
        run: >
          dotnet publish ./MCAgent/MCAgent.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output ./artifacts/${{ matrix.runtime }}/agent
          /p:ContinuousIntegrationBuild=true

      - name: Package remote agent
        run: |
          cd ./artifacts/${{ matrix.runtime }}/agent
          zip -r ../mc-agent-${{ matrix.runtime }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ./artifacts/${{ matrix.runtime }}/*.zip
          if-no-files-found: error

  publish-main-release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: publish-latest-release
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Check that this is still the current main build
        id: current
        shell: bash
        run: |
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping release because main has a newer commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move release tag to current commit
        if: steps.current.outputs.publish == 'true'
        run: |
          git tag --force latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force

      - name: Create or update release
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automated build from main.

            Commit: ${{ github.sha }}
          files: ./release-assets/*.zip
          overwrite_files: true
          make_latest: true
